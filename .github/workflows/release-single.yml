name: TEST Release Single
on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        required: true
      seconds:
        type: string
        default: '15'
concurrency:
  group: test-release-single
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  mock-release:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - env:
          SECONDS_INPUT: ${{ inputs.seconds }}
          LABEL: ${{ inputs.label }}
        run: |
          echo "TEST mock release $LABEL; no external effects"
          [[ "$SECONDS_INPUT" =~ ^[0-9]{1,3}$ ]] && [ "$SECONDS_INPUT" -le 100 ]
          sleep "$SECONDS_INPUT"
