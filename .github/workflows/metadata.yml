name: TEST Metadata and Base
on:
  pull_request:
    types: [opened, synchronize, edited]
concurrency:
  group: test-metadata-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && !github.event.changes.base && github.run_id || 'code' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  code:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTION: ${{ github.event.action }}
        run: |
          echo "TEST head=$HEAD base=$BASE base_ref=$BASE_REF tested=$GITHUB_SHA action=$ACTION"
          if [ "$ACTION" = opened ]; then sleep 100; else sleep 2; fi
